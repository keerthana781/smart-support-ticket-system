server:
  port: 8080

spring:
  application:
    name: support-desk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportdesk}
    username: ${DB_USERNAME:supportdesk}
    password: ${DB_PASSWORD:supportdesk}
  jpa:
    # "update" keeps the demo simple. A production app would use Flyway or Liquibase migrations.
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # DEV-ONLY default. Always set JWT_SECRET (a long random Base64 string) outside your laptop.
   secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    # Creates demo users and tickets on first start when the database is empty.
    enabled: ${SEED_DEMO_DATA:true}
  ai:
    # "gemini" calls Google's Gemini API. "rules" uses the offline keyword classifier.
    # If Gemini is selected but no key is set, or a call fails, the app falls back to rules.
    provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:15}
